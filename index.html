<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatter</title>
    <link rel ="stylesheet" href ="style.css"/>
</head>
<body>

    <div class="container">
        <div class="input-container">
            <h1>Your Text Goes Here</h1>
            <input type ="text" id ="input-field" placeholder="Type in your text!!">
        </div>

        <div class="btn-container">
            <button class="uppercase-btn"> ABC</button>
            <button class="lowercase-btn">abc</button>
            <button class="capitalize-btn">Abc</button>
            <button class="bold-btn">B</button>
            <button class="italic-btn"><i>I</i></button>
            <button class="underline-btn"><u>ABC</u></button>
        </div>

        <div class="output-container">
            <p id="output-field">Your formatted text will appear here.</p>
        </div>

        <diV class="accessibility">
            <button class="copy-btn">Copy</button>
            <button class="reset-btn">Reset</button>
        </diV>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
